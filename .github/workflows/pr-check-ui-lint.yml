name: PR Lint Test UI

on:
  pull_request:
    branches:
      - master
    paths:
      - HomePage-UI/**

jobs:
  test-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HomePage-UI

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 26

      - name: Install dependencies
        run: npm install

      - name: Run lint
        env:
            CI: false
        run: npm run lint